# df-archivio - Microservizio per gestione archivio documenti
services:
  df-archivio:
    image: nexus.ops.keypartner.cloud/repository/docker-acea/docs-flow/df-archivio:0.0.7
    container_name: df-archivio
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8088}:${SERVER_PORT:-8088}"
    environment:
      # Server
      SERVER_PORT: ${SERVER_PORT:-8088}
      # Database
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres_inf}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-ms_infasamento}
      POSTGRES_USER: ${POSTGRES_USER:-ms_infasamento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      KAFKA_SDI_TOPIC: ${KAFKA_SDI_TOPIC:-df-sdi-archivio}
      KAFKA_NOTIFICATION_TOPIC: ${KAFKA_NOTIFICATION_TOPIC:-df-archivio-notification-topic}
      # Hibernate - auto-create tables in dev
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Gradle
      GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true"
      GRADLE_USER_HOME: /root/.gradle
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${SERVER_PORT:-8088}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
    networks:
      acea-internal-network:
        ipv4_address: 192.168.200.103

networks:
  acea-internal-network:
    external: true
