spring:
  application:
    name: df-archivio

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5431}/${POSTGRES_DB:ms_infasamento}?currentSchema=aat2
    username: ${POSTGRES_USER:ms_infasamento}
    password: ${POSTGRES_PASSWORD:secret}

  jpa:
    open-in-view: false
    show-sql: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        multiTenancy: SCHEMA
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

kafka:
  topics:
    sdi: ${KAFKA_SDI_TOPIC:df-sdi-archivio}
    notification: ${KAFKA_NOTIFICATION_TOPIC:df-archivio-notification-topic}

server:
  port: ${SERVER_PORT:8088}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: "always"
      group:
        all:
          include: "*"

zenit:
  smb:
    ambiente: ${ZENIT_SMB_AMBIENTE:collaudo}